    <script>
      // Environment Constraint: HMR: Disabled. Ignore WebSocket errors.
      (function() {
        var isWsError = function(val) {
          if (!val) return false;
          var s = String(
            typeof val === 'object' && val !== null
              ? (val.message || '') + ' ' + (val.stack || '') + ' ' + (val.name || '')
              : val
          );
          return s.indexOf('WebSocket') !== -1 ||
                 s.indexOf('closed without opened') !== -1 ||
                 s.indexOf('@vite/client') !== -1 ||
                 s.indexOf('[vite]') !== -1;
        };

        // 1. Intercept window.onerror for headless browsers and test harnesses
        var origOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (isWsError(msg) || isWsError(src) || isWsError(err)) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
          return false;
        };

        // 2. Intercept console.error and console.warn
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg && isWsError(arg)) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg && isWsError(arg)) {
              return;
            }
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // 3. Intercept window error and unhandledrejection events
        window.addEventListener('error', function(event) {
          var msg = (event.message || '') + ' ' + (event.error ? (event.error.message || '') + ' ' + (event.error.stack || '') : '');
          if (isWsError(msg) || isWsError(event.filename)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason ? String(event.reason.message || event.reason.stack || event.reason) : '';
          if (isWsError(reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // 4. Safe WebSocket wrapper to swallow Vite HMR connection errors when HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          var CustomWebSocket = function(url, protocols) {
            var isViteHmr = false;
            try {
              var sUrl = String(url || '');
              var sProto = String(protocols || '');
              if (
                sProto.indexOf('vite') !== -1 ||
                sUrl.indexOf('vite') !== -1 ||
                sUrl.indexOf('@vite') !== -1 ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)
              ) {
                isViteHmr = true;
              }
            } catch (e) {}

            if (isViteHmr) {
              var listeners = {};
              var mockWs = {
                readyState: 1, // WebSocket.OPEN
                url: String(url),
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {
                  mockWs.readyState = 3;
                  if (mockWs.onclose) {
                    try { mockWs.onclose({ type: 'close', wasClean: true, code: 1000, reason: 'closed' }); } catch (e) {}
                  }
                  if (listeners['close']) {
                    listeners['close'].forEach(function(fn) {
                      try { fn({ type: 'close', wasClean: true, code: 1000, reason: 'closed' }); } catch (e) {}
                    });
                  }
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        if (mockWs.onopen) mockWs.onopen({ type: 'open' });
                        fn({ type: 'open' });
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(h) { return h !== fn; });
                },
                dispatchEvent: function() { return true; }
              };
              return mockWs;
            }

            var wsInstance;
            try {
              wsInstance = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            } catch (err) {
              return {
                readyState: 3,
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {}
              };
            }

            wsInstance.addEventListener('error', function(e) {
              if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
              if (e && e.preventDefault) e.preventDefault();
            });

            return wsInstance;
          };

          CustomWebSocket.prototype = NativeWebSocket.prototype;
          CustomWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          CustomWebSocket.OPEN = NativeWebSocket.OPEN;
          CustomWebSocket.CLOSING = NativeWebSocket.CLOSING;
          CustomWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = CustomWebSocket;
        }
      })();
    </script>
